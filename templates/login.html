{% extends "base.html" %}
{% block body %}
<div class="login card">
  <div class="logo">GAMING SMART</div>
  <p class="hint" style="margin-top:0">Gaming floor administration</p>
  {% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
  <form method="post" style="display:grid;gap:10px">
    <label>Username<input name="username" autofocus required autocomplete="username"></label>
    <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="big">Sign in</button>
  </form>
</div>
{% endblock %}
